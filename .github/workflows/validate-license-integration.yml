name: Validate VEXORA license integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/license-activation-cloud]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Run tests
        run: bun run test
