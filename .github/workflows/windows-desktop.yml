name: Windows Desktop Installer

on:
  push:
    branches:
      - windows-desktop-setup
      - fix/windows-desktop-functions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python for VEXORA icon
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate VEXORA Windows icon
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow cairosvg
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          @'
          import cairosvg
          from PIL import Image
          from io import BytesIO

          png = cairosvg.svg2png(url="public/vexora-logo.svg", output_width=256, output_height=256)
          image = Image.open(BytesIO(png)).convert("RGBA")
          image.save("src-tauri/icons/icon.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding utf8 generate_icon.py
          python generate_icon.py
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            Write-Error "O ícone do VEXORA não foi gerado."
            exit 1
          }

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and prerender frontend
        run: bun run build

      - name: Verify desktop entry page
        shell: pwsh
        run: |
          $index = Join-Path $PWD ".output/public/index.html"
          if (-not (Test-Path $index)) {
            Write-Error "Desktop build requires .output/public/index.html. The frontend build did not produce it."
            Get-ChildItem .output -Recurse -File | Select-Object -First 80 FullName
            exit 1
          }
          $html = Get-Content $index -Raw
          if ($html -notmatch "VEXORA SAMPLER") {
            Write-Error "The prerendered entry page does not contain the expected VEXORA SAMPLER marker."
            exit 1
          }

      - name: Build Windows installers
        run: bunx --package @tauri-apps/cli tauri build --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: vexora-sampler-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
