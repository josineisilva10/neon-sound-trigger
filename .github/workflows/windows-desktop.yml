name: Windows Desktop Installer

on:
  push:
    branches:
      - windows-desktop-setup
      - fix/windows-desktop-functions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate multi-size VEXORA Windows icon from the actual logo
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "vexora-icon-tool"
          New-Item -ItemType Directory -Force -Path $toolDir, "src-tauri/icons" | Out-Null
          npm install --prefix $toolDir --no-audit --no-fund @resvg/resvg-js
          $script = @'
          const fs = require("node:fs");
          const path = require("node:path");
          const { Resvg } = require(path.join(process.env.RUNNER_TEMP, "vexora-icon-tool", "node_modules", "@resvg", "resvg-js"));
          const svg = fs.readFileSync("public/vexora-logo.svg", "utf8");
          const sizes = [16, 24, 32, 48, 64, 128, 256];
          const images = sizes.map(size => new Resvg(svg, { fitTo: { mode: "width", value: size } }).render().asPng());
          const header = Buffer.alloc(6);
          header.writeUInt16LE(0, 0);
          header.writeUInt16LE(1, 2);
          header.writeUInt16LE(images.length, 4);
          const entries = images.map((png, i) => {
            const size = sizes[i];
            const entry = Buffer.alloc(16);
            entry.writeUInt8(size === 256 ? 0 : size, 0);
            entry.writeUInt8(size === 256 ? 0 : size, 1);
            entry.writeUInt8(0, 2);
            entry.writeUInt8(0, 3);
            entry.writeUInt16LE(1, 4);
            entry.writeUInt16LE(32, 6);
            entry.writeUInt32LE(png.length, 8);
            entry.writeUInt32LE(6 + images.length * 16 + images.slice(0, i).reduce((sum, img) => sum + img.length, 0), 12);
            return entry;
          });
          const ico = Buffer.concat([header, ...entries, ...images]);
          fs.writeFileSync("src-tauri/icons/icon.ico", ico);
          const written = fs.readFileSync("src-tauri/icons/icon.ico");
          if (written.readUInt16LE(2) !== 1 || written.readUInt16LE(4) !== sizes.length) throw new Error("Cabeçalho ICO inválido.");
          for (let i = 0; i < sizes.length; i++) {
            const entryOffset = 6 + i * 16;
            const size = written.readUInt8(entryOffset) || 256;
            const byteCount = written.readUInt32LE(entryOffset + 8);
            const imageOffset = written.readUInt32LE(entryOffset + 12);
            if (size !== sizes[i] || written.subarray(imageOffset, imageOffset + 4).toString("hex") !== "89504e47" || byteCount !== images[i].length) {
              throw new Error("Imagem ICO inválida no tamanho " + sizes[i] + "px.");
            }
          }
          console.log("Ícone VEXORA gerado e validado nos tamanhos: " + sizes.join(", ") + " px.");
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP "make-vexora-icon.cjs"
          Set-Content -Path $scriptPath -Value $script -Encoding utf8
          node $scriptPath
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { throw "O ícone VEXORA não foi gerado." }

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and prerender frontend
        run: bun run build

      - name: Verify desktop entry page
        shell: pwsh
        run: |
          $index = Join-Path $PWD ".output/public/index.html"
          if (-not (Test-Path $index)) {
            Write-Error "Desktop build requires .output/public/index.html. The frontend build did not produce it."
            Get-ChildItem .output -Recurse -File | Select-Object -First 80 FullName
            exit 1
          }
          $html = Get-Content $index -Raw
          if ($html -notmatch "VEXORA SAMPLER") {
            Write-Error "The prerendered entry page does not contain the expected VEXORA SAMPLER marker."
            exit 1
          }

      - name: Build Windows installers
        run: bunx --package @tauri-apps/cli tauri build --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: vexora-sampler-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
