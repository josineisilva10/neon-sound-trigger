name: Windows Desktop Installer

on:
  push:
    branches:
      - windows-desktop-setup
      - fix/windows-desktop-functions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate VEXORA Windows icon from the actual logo
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "vexora-icon-tool"
          New-Item -ItemType Directory -Force -Path $toolDir, "src-tauri/icons" | Out-Null
          npm install --prefix $toolDir --no-audit --no-fund @resvg/resvg-js
          $script = @'
          const fs = require("node:fs");
          const path = require("node:path");
          const { Resvg } = require(path.join(process.env.RUNNER_TEMP, "vexora-icon-tool", "node_modules", "@resvg", "resvg-js"));
          const svg = fs.readFileSync("public/vexora-logo.svg", "utf8");
          const png = new Resvg(svg, { fitTo: { mode: "width", value: 256 } }).render().asPng();
          // A Windows ICO can contain a PNG payload. Build the ICO directory/header directly,
          // avoiding png-to-ico CommonJS/ESM export differences across package versions.
          const header = Buffer.alloc(6);
          header.writeUInt16LE(0, 0); // reserved
          header.writeUInt16LE(1, 2); // ICO type
          header.writeUInt16LE(1, 4); // one image
          const entry = Buffer.alloc(16);
          entry.writeUInt8(0, 0); // width 256 is encoded as 0
          entry.writeUInt8(0, 1); // height 256 is encoded as 0
          entry.writeUInt8(0, 2); // palette
          entry.writeUInt8(0, 3); // reserved
          entry.writeUInt16LE(1, 4); // color planes
          entry.writeUInt16LE(32, 6); // bits per pixel
          entry.writeUInt32LE(png.length, 8);
          entry.writeUInt32LE(header.length + entry.length, 12);
          const ico = Buffer.concat([header, entry, png]);
          fs.writeFileSync("src-tauri/icons/icon.ico", ico);
          // Verify the ICO directory points to the embedded PNG payload.
          const written = fs.readFileSync("src-tauri/icons/icon.ico");
          if (written.readUInt16LE(2) !== 1 || written.readUInt16LE(4) !== 1 || written.readUInt32LE(18) !== 22) {
            throw new Error("O cabeçalho do ícone ICO gerado é inválido.");
          }
          if (written.readUInt32LE(14) !== png.length || written.subarray(22, 26).toString("hex") !== "89504e47") {
            throw new Error("O conteúdo PNG dentro do ICO é inválido.");
          }
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP "make-vexora-icon.cjs"
          Set-Content -Path $scriptPath -Value $script -Encoding utf8
          node $scriptPath
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { throw "O ícone VEXORA não foi gerado." }

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and prerender frontend
        run: bun run build

      - name: Verify desktop entry page
        shell: pwsh
        run: |
          $index = Join-Path $PWD ".output/public/index.html"
          if (-not (Test-Path $index)) {
            Write-Error "Desktop build requires .output/public/index.html. The frontend build did not produce it."
            Get-ChildItem .output -Recurse -File | Select-Object -First 80 FullName
            exit 1
          }
          $html = Get-Content $index -Raw
          if ($html -notmatch "VEXORA SAMPLER") {
            Write-Error "The prerendered entry page does not contain the expected VEXORA SAMPLER marker."
            exit 1
          }

      - name: Build Windows installers
        run: bunx --package @tauri-apps/cli tauri build --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: vexora-sampler-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
