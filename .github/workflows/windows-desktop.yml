name: Windows Desktop Installer

on:
  push:
    branches:
      - windows-desktop-setup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and prerender frontend
        run: bun run build

      - name: Verify desktop entry page
        shell: pwsh
        run: |
          $index = Join-Path $PWD ".output/public/index.html"
          if (-not (Test-Path $index)) {
            Write-Error "Desktop build requires .output/public/index.html. The frontend build did not produce it."
            Get-ChildItem .output -Recurse -File | Select-Object -First 80 FullName
            exit 1
          }
          $html = Get-Content $index -Raw
          if ($html -notmatch "VEXORA SAMPLER") {
            Write-Error "The prerendered entry page does not contain the expected VEXORA SAMPLER marker."
            exit 1
          }

      - name: Build Windows installers
        run: bunx tauri build --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: vexora-sampler-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
